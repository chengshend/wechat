<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客户对接联系页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;}
body{
    background-color:#f5f7fa;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.card{
    background:#ffffff;
    border-radius:20px;
    max-width:340px;
    width:100%;
    padding:32px;
    text-align:center;
    box-shadow:0 2px 16px rgba(0,0,0,0.08);
}
h1{
    font-size:24px;
    color:#222831;
    margin-bottom:8px;
}
.sub-title{
    color:#e53e3e;
    font-size:16px;
    margin-bottom:24px;
}
p{
    color:#555555;
    font-size:14px;
    line-height:1.7;
    margin:8px 0;
}
.qr-wrap{
    margin:26px 0;
}
.qr-wrap img{
    width:220px;
    height:220px;
    object-fit:contain;
}
.qr-tip{
    color:#666666;
    font-size:13px;
    margin-bottom:22px;
}
.tag-group{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:20px;
}
.tag{
    background-color:#f3e8ff;
    color:#7e22ce;
    padding:4px 12px;
    border-radius:999px;
    font-size:13px;
}
.info-notice{
    background-color:#fffbeb;
    padding:12px;
    border-radius:10px;
    color:#92400e;
    font-size:13px;
    line-height:1.6;
}
</style>
</head>
<body>
<div class="card">
    <h1>GPT渠道商</h1>
    <div class="sub-title">添加客服对接充值</div>

    <p>平台限制较多，消息无法回复，请+v沟通</p>
    <p>第一次购买建议平台下单，价格查看规格</p>
    <p>加上好友后，截图订单备注</p>
    <div class="qr-wrap">
        <!-- ========== 替换二维码：把wechat-qr.png换成你的二维码图片 ========== -->
        <img src="wechat-qr.png" alt="微信客服二维码">
    </div>
    <div class="qr-tip">截图保存二维码，打开微信扫码添加客服</div>

    <div class="tag-group">
        <span class="tag">售后对接</span>
        <span class="tag">进度同步</span>
        <span class="tag">在线咨询</span>
    </div>

    <div class="info-notice">
        账号注册：注册谷歌邮箱账号，登录GPT即可使用
    </div>
</div>
</body>
</html>
